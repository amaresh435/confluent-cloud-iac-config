trigger:
  - master

pool:
  vmImage: ubuntu-latest

parameters:
  - name: terraformVersion
    displayName: Terraform version
    type: string
    default: '1.9.8'
  - name: terraformWorkingDirectory
    displayName: Terraform working directory
    type: string
    default: ./environments/pr/
  - name: terraformPlanExtraArgs
    displayName: Extra terraform plan arguments
    type: string
    default: '-parallelism=2'
  - name: terraformApplyExtraArgs
    displayName: Extra terraform apply arguments
    type: string
    default: '-parallelism=2'

variables:
  tfWorkingDir: ${{ parameters.terraformWorkingDirectory }}
  planArtifactName: tfplan-artifact

stages:
  - stage: Plan
    displayName: Terraform Plan
    jobs:
      - job: Plan
        displayName: Terraform Plan
        steps:
          - checkout: self

          - task: DownloadSecureFile@1
            name: tfmSecureFile
            displayName: Download GCP service-account credential
            inputs:
              secureFile: tfm-sa-gcp-amar.json

          - bash: |
              set -euo pipefail
              terraform_version='${{ parameters.terraformVersion }}'
              install_dir="$HOME/.local/bin"
              archive="terraform_${terraform_version}_linux_amd64.zip"
              download_url="https://releases.hashicorp.com/terraform/${terraform_version}/${archive}"
              mkdir -p "$install_dir"
              curl --fail --silent --show-error --location --retry 3 "$download_url" --output "/tmp/$archive"
              unzip -o "/tmp/$archive" -d "$install_dir"
              chmod +x "$install_dir/terraform"
              echo "##vso[task.prependpath]$install_dir"
              "$install_dir/terraform" version
            displayName: Install Terraform ${{ parameters.terraformVersion }}

          - script: terraform init -input=false
            displayName: Terraform init
            workingDirectory: $(tfWorkingDir)
            env:
              GOOGLE_APPLICATION_CREDENTIALS: $(tfmSecureFile.secureFilePath)
              CONFLUENT_CLOUD_API_KEY: $(CONFLUENT_CLOUD_API_KEY)
              CONFLUENT_CLOUD_API_SECRET: $(CONFLUENT_CLOUD_API_SECRET)

          - script: terraform plan -input=false -out=tfplan ${{ parameters.terraformPlanExtraArgs }}
            displayName: Terraform plan
            workingDirectory: $(tfWorkingDir)
            env:
              GOOGLE_APPLICATION_CREDENTIALS: $(tfmSecureFile.secureFilePath)
              CONFLUENT_CLOUD_API_KEY: $(CONFLUENT_CLOUD_API_KEY)
              CONFLUENT_CLOUD_API_SECRET: $(CONFLUENT_CLOUD_API_SECRET)

          # Package the whole working dir (includes .terraform, tfplan, lock file)
          # so Apply doesn't need to re-init against a potentially different state.
          - task: ArchiveFiles@2
            displayName: Archive plan output
            inputs:
              rootFolderOrFile: $(tfWorkingDir)
              includeRootFolder: false
              archiveType: tar
              archiveFile: $(Build.ArtifactStagingDirectory)/$(planArtifactName).tar.gz

          - task: PublishPipelineArtifact@1
            displayName: Publish plan artifact
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/$(planArtifactName).tar.gz
              artifact: $(planArtifactName)

  - stage: Apply
    displayName: Terraform Apply
    dependsOn: Plan
    condition: succeeded()
    jobs:
      - job: ApprovalGate
        displayName: Wait for approval
        pool: server
        timeoutInMinutes: 3
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 3
            inputs:
              notifyUsers: |
                amareshguligoudar@gmail.com
              instructions: 'Review the Terraform plan output and approve to proceed with apply.'
      
      - job: Apply
        displayName: Terraform Apply
        steps:
          - checkout: self

          - task: DownloadSecureFile@1
            name: tfmSecureFile
            displayName: Download GCP service-account credential
            inputs:
              secureFile: tfm-sa-gcp-amar.json

          - bash: |
              set -euo pipefail
              terraform_version='${{ parameters.terraformVersion }}'
              install_dir="$HOME/.local/bin"
              archive="terraform_${terraform_version}_linux_amd64.zip"
              download_url="https://releases.hashicorp.com/terraform/${terraform_version}/${archive}"
              mkdir -p "$install_dir"
              curl --fail --silent --show-error --location --retry 3 "$download_url" --output "/tmp/$archive"
              unzip -o "/tmp/$archive" -d "$install_dir"
              chmod +x "$install_dir/terraform"
              echo "##vso[task.prependpath]$install_dir"
              "$install_dir/terraform" version
            displayName: Install Terraform ${{ parameters.terraformVersion }}

          - script: terraform init -input=false
            displayName: Terraform init
            workingDirectory: $(tfWorkingDir)
            env:
              GOOGLE_APPLICATION_CREDENTIALS: $(tfmSecureFile.secureFilePath)
              CONFLUENT_CLOUD_API_KEY: $(CONFLUENT_CLOUD_API_KEY)
              CONFLUENT_CLOUD_API_SECRET: $(CONFLUENT_CLOUD_API_SECRET)

          - script: terraform apply -input=false -auto-approve
            displayName: Terraform apply
            workingDirectory: $(tfWorkingDir)
            env:
              GOOGLE_APPLICATION_CREDENTIALS: $(tfmSecureFile.secureFilePath)
              CONFLUENT_CLOUD_API_KEY: $(CONFLUENT_CLOUD_API_KEY)
              CONFLUENT_CLOUD_API_SECRET: $(CONFLUENT_CLOUD_API_SECRET)
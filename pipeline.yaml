trigger:
  - main

pool:
  vmImage: ubuntu-latest

parameters:
  - name: terraformVersion
    displayName: Terraform version
    type: string
    default: '1.9.8'

  - name: terraformWorkingDirectory
    displayName: Terraform working directory
    type: string
    default: examples/basic

  # Use for trusted Terraform CLI options, for example: -var-file=production.tfvars
  - name: terraformPlanExtraArgs
    displayName: Extra terraform plan arguments
    type: string
    default: ''

  # Use for trusted Terraform CLI options, for example: -lock-timeout=5m
  - name: terraformApplyExtraArgs
    displayName: Extra terraform apply arguments
    type: string
    default: ''

steps:
  - checkout: self

  - task: DownloadSecureFile@1
    name: tfmSecureFile
    displayName: Download GCP service-account credential
    inputs:
      secureFile: tfm-sa-gcp-amar.json

  - task: TerraformInstaller@1
    displayName: Install Terraform ${{ parameters.terraformVersion }}
    inputs:
      terraformVersion: ${{ parameters.terraformVersion }}

  - script: terraform init -input=false
    displayName: Terraform init
    workingDirectory: ${{ parameters.terraformWorkingDirectory }}
    env:
      GOOGLE_APPLICATION_CREDENTIALS: $(tfmSecureFile.secureFilePath)
      CONFLUENT_CLOUD_API_KEY: $(CONFLUENT_CLOUD_API_KEY)
      CONFLUENT_CLOUD_API_SECRET: $(CONFLUENT_CLOUD_API_SECRET)

  - script: terraform plan -input=false -out=tfplan ${{ parameters.terraformPlanExtraArgs }}
    displayName: Terraform plan
    workingDirectory: ${{ parameters.terraformWorkingDirectory }}
    env:
      GOOGLE_APPLICATION_CREDENTIALS: $(tfmSecureFile.secureFilePath)
      CONFLUENT_CLOUD_API_KEY: $(CONFLUENT_CLOUD_API_KEY)
      CONFLUENT_CLOUD_API_SECRET: $(CONFLUENT_CLOUD_API_SECRET)

  - script: terraform apply -input=false -auto-approve ${{ parameters.terraformApplyExtraArgs }} tfplan
    displayName: Terraform apply
    workingDirectory: ${{ parameters.terraformWorkingDirectory }}
    env:
      GOOGLE_APPLICATION_CREDENTIALS: $(tfmSecureFile.secureFilePath)
      CONFLUENT_CLOUD_API_KEY: $(CONFLUENT_CLOUD_API_KEY)
      CONFLUENT_CLOUD_API_SECRET: $(CONFLUENT_CLOUD_API_SECRET)